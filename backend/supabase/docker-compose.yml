version: '3.8'

services:
  civicfix-db:
    image: postgres:15-alpine
    container_name: civfix_database_container
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: civfix_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secure_password_123
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata: